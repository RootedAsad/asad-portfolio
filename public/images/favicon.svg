<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <clipPath id="circleClip">
      <circle cx="32" cy="32" r="30"></circle>
    </clipPath>
  </defs>

  <!-- Circular crop -->
  <image href="/images/favicon.png" x="2" y="2" width="60" height="60" preserveAspectRatio="xMidYMid slice" clip-path="url(#circleClip)"></image>
</svg>